<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>작대 구성</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
    }
    .updated {
      text-align: right;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    .squad-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .squad {
      background: #ffffff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .squad-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    .member-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .member {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }
    .member:last-child {
      border-bottom: none;
    }
    .small {
      font-size: 12px;
      color: #999;
      margin-top: 16px;
    }
    .btn {
      display: inline-block;
      margin: 12px;
      padding: 14px 28px;
      background: white;
      border-radius: 10px;
      border: 1px solid #333;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #333;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>작대 구성</h1>
  <div class="updated">
    {% if last_updated %}마지막 갱신: {{ last_updated }}{% else %}불러오는 중...{% endif %}
  </div>
  <div class="squad-list">
    {% for squad in squads %}
    <div class="squad">
      <div class="squad-title">작대 {{ squad.squad_num }}</div>
      <ul class="member-list">
        {% for member in squad.members %}
        <li class="member">{{ member }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
  <a class="btn" href="/">홈으로</a>
</body>
</html>
