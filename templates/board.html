<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대회 공지 / 상황판</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="10">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
    }
    .updated {
      text-align: right;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notice {
      background: #ffffff;
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .notice-time {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .notice-body {
      white-space: pre-wrap;
      font-size: 14px;
    }
    .small {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }
    .btn {
      display: inline-block;
      margin: 12px;
      padding: 14px 28px;
      background: white;
      border-radius: 10px;
      border: 1px solid #333;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>공지 / 상황판</h1>
  <div class="updated">
    {% if last_updated %}마지막 갱신: {{ last_updated }}{% else %}불러오는 중...{% endif %}
  </div>
  <div class="notice-list">
    {% if notices %}
      {% for notice in notices %}
      <div class="notice">
        <div class="notice-time">{{ notice.time }}</div>
        <div class="notice-body">{{ notice.body }}</div>
      </div>
      {% endfor %}
    {% else %}
      <div class="notice">현재 표시할 공지가 없습니다.</div>
    {% endif %}
  </div>
  <p class="small">※ 10초마다 자동으로 갱신됩니다.</p>
  <a class="btn" href="/">홈으로</a>
</body>
</html>
