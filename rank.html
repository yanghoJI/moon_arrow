<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대회 현재 등수</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
    }
    .updated {
      text-align: right;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
      font-size: 14px;
    }
    th {
      background: #222;
      color: #fff;
    }
    tr:nth-child(even) td {
      background: #fafafa;
    }
    .name {
      text-align: left;
    }
    .small {
      font-size: 12px;
      color: #999;
    }
    .btn {
      display: inline-block;
      margin: 12px;
      padding: 14px 28px;
      background: white;
      border-radius: 10px;
      border: 1px solid #333;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>현재 등수</h1>
  <div class="updated" id="updated">불러오는 중...</div>
  <table>
    <thead>
      <tr>
        <th>순위</th>
        <th>이름</th>
        <th>총합</th>
        <th>1·2·3순 합</th>
      </tr>
    </thead>
    <tbody id="rank-body">
      <!-- JS로 줄이 추가됩니다 -->
    </tbody>
  </table>
  <p class="small">※ 10초마다 자동으로 갱신됩니다. 새로고침해도 됩니다.</p>

  <a class="btn" href="index.html">홈으로</a>

  <script>
    // ✅ 여기만 네 rank 시트의 CSV 주소로 교체하면 됨
    // 예: https://docs.google.com/spreadsheets/d/XXXX/export?format=csv&gid=YYYY
    const RANKINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTqsmOlxzgGxrh91wGE0b92x3x40Ta1ZT2l0yd6rTKq5HsrZSng3qocNXwmypouA5F6H68HV46GPVHJ/pub?gid=0&single=true&output=csv";

    async function loadRanking() {
      const updated = document.getElementById("updated");
      const tbody = document.getElementById("rank-body");

      try {
        const url =
          RANKINGS_CSV_URL +
          (RANKINGS_CSV_URL.includes("?") ? "&" : "?") +
          "cachebuster=" +
          Date.now();

        const res = await fetch(url);
        if (!res.ok) {
          throw new Error("HTTP 상태코드: " + res.status);
        }

        const text = await res.text();

        // HTML이 오면 (권한 문제 등) 바로 에러 처리
        if (text.trim().startsWith("<")) {
          throw new Error("CSV 대신 HTML 응답이 왔습니다. (공유/권한 설정 확인 필요)");
        }

        const rows = text
          .trim()
          .split(/\r?\n/)
          .map(line => line.split(","));

        // rows[0] : 1행(큰 제목들)
        // rows[1] : 2행(헤더: 이름/순위/총합/1시/2시/...)
        const dataRows = rows.slice(2);

        const items = dataRows
          .map(cols => {
            const name = (cols[1] ?? "").trim();      // B열: 이름
            if (!name) return null;

            const total = Number(cols[3] ?? 0);       // D열: 총합

            // 1순 시간별 (E~I → 인덱스 4~8)
            const firstRoundShots = [
              Number(cols[4] ?? 0),
              Number(cols[5] ?? 0),
              Number(cols[6] ?? 0),
              Number(cols[7] ?? 0),
              Number(cols[8] ?? 0),
            ];

            const firstRoundSum  = Number(cols[9]  ?? 0);  // J열: 1순 합
            const secondRoundSum = Number(cols[15] ?? 0);  // P열: 2순 합
            const thirdRoundSum  = Number(cols[21] ?? 0);  // V열: 3순 합

            return {
              name,
              total,
              firstRoundSum,
              secondRoundSum,
              thirdRoundSum,
              firstRoundShots,
            };
          })
          .filter(item => item !== null);

        // 🔥 순위 정렬 로직
        items.sort((a, b) => {
          // 1) 총합 높은 사람
          if (b.total !== a.total) {
            return b.total - a.total;
          }

          // 2) 1순 합, 2순 합, 3순 합 순으로 비교
          if (b.firstRoundSum !== a.firstRoundSum) {
            return b.firstRoundSum - a.firstRoundSum;
          }
          if (b.secondRoundSum !== a.secondRoundSum) {
            return b.secondRoundSum - a.secondRoundSum;
          }
          if (b.thirdRoundSum !== a.thirdRoundSum) {
            return b.thirdRoundSum - a.thirdRoundSum;
          }

          // 3) 1순에서 먼저 맞춘 사람 (왼쪽부터 비교)
          for (let i = 0; i < a.firstRoundShots.length; i++) {
            if (b.firstRoundShots[i] !== a.firstRoundShots[i]) {
              // 더 빠른 시간에 맞춘(값이 1인) 사람이 우위
              return b.firstRoundShots[i] - a.firstRoundShots[i];
            }
          }

          // 완전 동률이면 순서 유지
          return 0;
        });

        tbody.innerHTML = "";
        items.forEach((item, idx) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${idx + 1}</td>
            <td class="name">${item.name}</td>
            <td>${item.total}</td>
            <td>${item.firstRoundSum} / ${item.secondRoundSum} / ${item.thirdRoundSum}</td>
          `;
          tbody.appendChild(tr);
        });

        const now = new Date();
        updated.textContent =
          "마지막 갱신: " +
          now.toLocaleTimeString("ko-KR", { hour12: false });
      } catch (e) {
        console.error(e);
        updated.textContent = "불러오는 중 오류가 발생했습니다: " + e.message;
        tbody.innerHTML = "";
      }
    }

    loadRanking();
    setInterval(loadRanking, 10000);
  </script>
</body>
</html>
