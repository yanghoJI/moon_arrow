<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>작대 구성</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
    }
    .updated {
      text-align: right;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    .squad-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .squad {
      background: #ffffff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .squad-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    .member-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .member {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }
    .member:last-child {
      border-bottom: none;
    }
    .small {
      font-size: 12px;
      color: #999;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>작대 구성</h1>
  <div class="updated" id="updated">불러오는 중...</div>
  <div class="squad-list" id="squad-list">
    <!-- JS로 작대가 추가됩니다 -->
  </div>
  <p class="small">※ 10초마다 자동으로 갱신됩니다.</p>

  <script>
    // rank 시트의 CSV 주소
    const RANKINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTqsmOlxzgGxrh91wGE0b92x3x40Ta1ZT2l0yd6rTKq5HsrZSng3qocNXwmypouA5F6H68HV46GPVHJ/pub?gid=0&single=true&output=csv";

    async function loadSquads() {
      const updated = document.getElementById("updated");
      const container = document.getElementById("squad-list");

      try {
        const url =
          RANKINGS_CSV_URL +
          (RANKINGS_CSV_URL.includes("?") ? "&" : "?") +
          "cachebuster=" +
          Date.now();

        const res = await fetch(url);
        if (!res.ok) {
          throw new Error("HTTP 상태코드: " + res.status);
        }

        const text = await res.text();

        // HTML이 오면 에러
        if (text.trim().startsWith("<")) {
          throw new Error("CSV 대신 HTML 응답이 왔습니다.");
        }

        const rows = text
          .trim()
          .split(/\r?\n/)
          .map(line => line.split(","));

        // rows[0] : 1행(큰 제목들)
        // rows[1] : 2행(헤더)
        const dataRows = rows.slice(2);

        // 작대별로 그룹화
        const squads = {};
        dataRows.forEach(cols => {
          const squadNum = (cols[0] ?? "").trim(); // A열: 작대 번호
          const name = (cols[1] ?? "").trim();     // B열: 이름
          if (squadNum && name) {
            if (!squads[squadNum]) {
              squads[squadNum] = [];
            }
            squads[squadNum].push(name);
          }
        });

        // 작대 번호 순으로 정렬
        const sortedSquads = Object.keys(squads).sort((a, b) => Number(a) - Number(b));

        container.innerHTML = "";
        sortedSquads.forEach(squadNum => {
          const members = squads[squadNum];
          const div = document.createElement("div");
          div.className = "squad";
          div.innerHTML = `
            <div class="squad-title">작대 ${squadNum}</div>
            <ul class="member-list">
              ${members.map(name => `<li class="member">${name}</li>`).join("")}
            </ul>
          `;
          container.appendChild(div);
        });

        const now = new Date();
        updated.textContent =
          "마지막 갱신: " +
          now.toLocaleTimeString("ko-KR", { hour12: false });
      } catch (e) {
        console.error(e);
        updated.textContent = "불러오는 중 오류가 발생했습니다: " + e.message;
        container.innerHTML = "";
      }
    }

    loadSquads();
    setInterval(loadSquads, 10000);
  </script>
</body>
</html>
